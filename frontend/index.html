<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CRM com captacao automatica de leads." />
    <!-- The app paints its own background from a CSS token; telling the browser
         which schemes are supported avoids a white flash before CSS loads. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Loaded with <link> rather than an @import in the CSS: an @import chains
         a second request behind the stylesheet and delays first paint. The font
         stack falls back to system-ui, so the app is legible before Inter lands. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap"
    />
    <title>Insights CRM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
